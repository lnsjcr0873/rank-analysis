name: Build EXE (No Sign)

# Fork 专用按需构建：不签名、不发布，产物走 Actions Artifact，仅供自测。
# 主仓库的 release.yml 需要 TAURI_SIGNING_PRIVATE_KEY 等 secrets（fork 不继承），
# 所以这里在构建前临时关掉 updater 签名（createUpdaterArtifacts=false + 清空 pubkey），
# 让 Tauri 打包不要求私钥。可用：
#   1. Actions 页 → Build EXE (No Sign) → Run workflow
#   2. 几分钟后 → Artifacts → rank-analysis-exe 下载 NSIS 安装包
# 注意：产物没签名，Windows 可能弹 SmartScreen；仅本地自测用，别当正式安装包分发。

on:
  workflow_dispatch:
    inputs:
      ocr:
        description: 'Include ocr-rapid (self-contained RapidOCR model, needed on Win10 LTSC)'
        required: false
        default: true
        type: boolean

jobs:
  build-exe:
    name: Build Windows EXE (unsigned)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./rank-analysis-app

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rank-analysis-app/package-lock.json

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      # 只在 runner 工作区改 tauri.conf.json，不回写仓库：
      # updater 签名开关在 bundle.createUpdaterArtifacts（Tauri 2 的正确位置，
      # 曾误放在 plugins.updater 下被静默忽略——见 docs/backend-integration-audit
      # 一.2）；构建前置 false 让打包不再要求 TAURI_SIGNING_PRIVATE_KEY。
      - name: Disable updater signing requirement
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.bundle = j.bundle || {};
            j.bundle.createUpdaterArtifacts = false;
            if (j.plugins && j.plugins.updater) {
              delete j.plugins.updater.createUpdaterArtifacts;
            }
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            console.log("updater signing disabled for build (bundle.createUpdaterArtifacts=false)");
          '

      # 自带模型 OCR（ocr-rapid）：Win10 LTSC 无 WinRT 中文包，
      # 不带此特性打出来的包自动识别不可用（仅手动三选一）。
      # 手动触发时 `ocr` 输入为 false 则打出无 OCR 的轻量包。
      - name: Build Tauri App (nsis, unsigned)
        shell: bash
        env:
          OCR_INPUT: ${{ inputs.ocr }}
        run: |
          if [ "$OCR_INPUT" = "false" ]; then
            echo "Building WITHOUT ocr-rapid (manual override)"
            npm run tauri build -- --bundles nsis
          else
            echo "Building WITH ocr-rapid (default)"
            npm run tauri build -- --bundles nsis --features ocr-rapid
          fi

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: rank-analysis-exe
          path: rank-analysis-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30