# Mayhem & ARAM 全景大数据 SGP 自动化采集、清洗与云端分发流水线
# 产物生成在 data/mayhem/ (manifest.json, champions.json, augments.json, items.json, champion-shards/*.json, version.json)
# 客户端通过 jsDelivr / GitHub Raw CDN 极速无感同步
name: Mayhem SGP Data Harvest & Pipeline

on:
  schedule:
    - cron: "0 4 * * *" # 每日 UTC 04:00 (北京时间 12:00) 定时自动执行
  workflow_dispatch:
    inputs:
      patch:
        description: "游戏补丁版本号 (如 16.17)"
        required: false
        default: "16.17"
      regions:
        description: "目标大区列表 (逗号分隔，如 HN1,WT1,KR,NA)"
        required: false
        default: "HN1,WT1,KR,NA"
      max_matches:
        description: "最大采集对局样本量"
        required: false
        default: "20000"
      force:
        description: "强制重新清洗并构建"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mayhem-data-harvest
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore SGP & CDragon Match Cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/mayhem
            node_modules
          key: mayhem-cache-${{ runner.os }}-${{ github.event.inputs.patch || '16.17' }}-${{ github.run_id }}
          restore-keys: |
            mayhem-cache-${{ runner.os }}-${{ github.event.inputs.patch || '16.17' }}-
            mayhem-cache-${{ runner.os }}-

      - name: Run Harvester Engine Tests
        run: node --test scripts/harvest-mayhem.test.mjs

      - name: Execute Mayhem Data Harvesting & Processing
        run: node scripts/harvest-mayhem.mjs
        env:
          MAYHEM_PATCH: ${{ github.event.inputs.patch || '16.17' }}
          MAYHEM_REGIONS: ${{ github.event.inputs.regions || 'HN1,WT1,KR,NA' }}
          MAYHEM_MAX_MATCHES: ${{ github.event.inputs.max_matches || '20000' }}
          MAYHEM_FORCE: ${{ github.event.inputs.force || 'false' }}

      - name: Verify Mayhem Manifest & Datasets Integrity
        id: verify
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('./data/mayhem/manifest.json', 'utf8'));
            const v = JSON.parse(fs.readFileSync('./data/mayhem/version.json', 'utf8'));
            if (m.schemaVersion !== 1 || !m.files['champions.json'] || !m.files['augments.json']) {
              console.error('Invalid manifest structure:', m);
              process.exit(1);
            }
            console.log('✅ Manifest verification passed.');
            console.log('Version:', m.version, 'Patch:', m.patch, 'Total Files:', Object.keys(m.files).length);
          "

      - name: Generate GitHub Actions Step Summary
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('./data/mayhem/manifest.json')) return;
            const m = JSON.parse(fs.readFileSync('./data/mayhem/manifest.json', 'utf8'));
            const c = JSON.parse(fs.readFileSync('./data/mayhem/champions.json', 'utf8'));
            const a = JSON.parse(fs.readFileSync('./data/mayhem/augments.json', 'utf8'));
            
            const summary = [
              '# 🌟 Mayhem & ARAM SGP 大数据清洗与构建报告',
              '',
              '| 指标 | 统计值 |',
              '| :--- | :--- |',
              '| **版本号 (Version)** | \`' + m.version + '\` |',
              '| **适用补丁 (Patch)** | \`' + m.patch + '\` |',
              '| **英雄总数 (Champions)** | **' + c.count + '** 个 |',
              '| **海克斯强化数 (Augments)** | **' + a.count + '** 个 |',
              '| **独立分片数 (Shards)** | **' + (Object.keys(m.files).length - 2) + '** 个 |',
              '| **数据生成时间 (UTC)** | \`' + m.generatedAt + '\` |',
              '',
              '### 🚀 产物文件清单与 SHA256',
              '| 文件路径 | 大小 (Bytes) | SHA256 签名 (前16位) |',
              '| :--- | :--- | :--- |',
              '| \`manifest.json\` | ' + fs.statSync('./data/mayhem/manifest.json').size + ' | \`' + m.files['champions.json'].sha256.slice(0, 16) + '...\` |',
              '| \`champions.json\` | ' + m.files['champions.json'].sizeBytes + ' | \`' + m.files['champions.json'].sha256.slice(0, 16) + '...\` |',
              '| \`augments.json\` | ' + m.files['augments.json'].sizeBytes + ' | \`' + m.files['augments.json'].sha256.slice(0, 16) + '...\` |',
              '',
              '> ✅ 所有产物均已通过 SHA-256 校验，客户端将通过 jsDelivr CDN 自动拉取更新。'
            ].join('\n');
            
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          "

      - name: Commit and Push Datasets if Changed
        id: commit
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/mayhem-assist-m3'
        run: |
          if [ -z "$(git status --porcelain -- data/mayhem)" ]; then
            echo "No data changes detected. Skipping push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mayhem
          git commit -m "chore(data): 自动更新海克斯大乱斗 SGP 全景大数据 [skip ci]"
          git push origin HEAD:${{ github.ref }}
